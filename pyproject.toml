[project]
name = "core-tessie-api"
version = "0.1.0"
description = "FastAPI-based Python Worker for Tessie data and AI agents."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.109.0",
    "starlette==0.37.2",
    "pydantic==1.10.13",
    "PyYAML==6.0.2",
    "PyJWT==2.8.0",
    "python-dotenv==1.0.1",
    "aiohttp==3.9.5",
    "pytz==2025.1",
    "pytest-asyncio==0.23.8"
]

[dependency-groups]
dev = ["workers-py"]
